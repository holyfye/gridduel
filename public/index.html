// ---- sound toggle + capture-animation hook ----
function soundToggle(){
  const b=el('button','snd-toggle'+(GD.getSound()?'':' off'), GD.getSound()?'🔊':'🔇');
  b.onclick=()=>{ GD.setSound(!GD.getSound()); b.textContent=GD.getSound()?'🔊':'🔇'; b.classList.toggle('off',!GD.getSound()); GD.sfx&&GD.sfx('pick'); };
  return b;
}
window.__markWon=(id)=>{ justWonId=id; setTimeout(()=>{ justWonId=null; },650); };

// ===================================================================
// PLAYER SCREEN (own phone) — lobby wait, draft turn, duel clue
// ===================================================================
function myPlayerId(){
  // Find which state player belongs to this device via clientId.
  const st=S(); if(!st) return null;
  const me=st.players.find(p=>p.clientId===GD.MYID);
  return me?me.id:null;
}
function renderPlayer(){
  currentScreen='player';
  app.innerHTML='';
  const st=S();
  const w=el('div','wrap player-wrap');
  // header
  const head=el('div','player-head');
  head.innerHTML=`<span class="logo-sm">GRID DUEL</span><span class="status-pill ${GD.connLive?'live':''}"><span class="dot"></span><span class="txt">${GD.connLive?'Connected':'Reconnecting…'}</span></span>`;
  w.append(head);

  if(!st || st.phase==='lobby' || st.phase===undefined && !st.phase){
    // Not started yet — waiting in lobby
  }
  if(!st || !st.phase){
    const r=GD.getRoster&&GD.getRoster();
    let rosterHtml='';
    if(r&&r.players&&r.players.length){
      rosterHtml='<div class="lobby-list" style="margin-top:14px">'+
        r.players.map((nm,i)=>`<div class="lobby-player" style="--pc:${PCOLORS[i%PCOLORS.length]}"><span class="lp-dot"></span><span class="lp-name">${nm}</span><span class="lp-tag">ready</span></div>`).join('')+
        '</div>'+
        `<p class="note dim" style="margin-top:8px">${r.players.length} player${r.players.length===1?'':'s'} in${r.judges?' · judge ready':' · waiting for judge'}</p>`;
    } else {
      rosterHtml='<p class="note">Waiting for the host to start the game…</p>';
    }
    w.append(centerCard(`<div class="big-emoji">⏳</div><h2>You're in!</h2>${rosterHtml}`));
    app.append(w); return;
  }

  const pid=myPlayerId();
  const meName = pid!=null ? nameOf(pid) : (GD.MYNAME||'You');

  if(st.phase==='draft'){
    const d=st.draft;
    const myTurn = d && d.picker===pid;
    if(myTurn){
      w.append(el('div','turn-banner mine',`Your turn, ${meName} — pick a tile`));
      const sub=el('p','note'); const need=d.quota[d.picker]-d.claimed[d.picker];
      sub.innerHTML=`Tap a highlighted tile to claim it · ${d.claimed[d.picker]}/${d.quota[d.picker]} claimed`;
      w.append(sub);
      w.append(buildPlayerDraftGrid(st,pid));
    } else {
      const who = d ? nameOf(d.picker) : '…';
      w.append(centerCard(`<div class="big-emoji">✋</div><h2>Waiting…</h2><p class="note"><b style="color:${d?colorOf(d.picker):'#fff'}">${who}</b> is choosing a tile.</p>`));
      w.append(miniBoardView(st));
    }
    app.append(w); return;
  }

  if(st.phase==='conquest'){
    const cq=st.conquest;
    if(cq && cq.sub==='duel' && cq.duel){
      const d=cq.duel;
      const amInvolved = (pid===d.challenger||pid===d.defender);
      w.append(el('div','turn-banner'+(amInvolved?' mine':'')+' compact', amInvolved?`Your duel · ${d.cat}`:`${d.cat}`));
      // Dual timer bar — both players' clocks, active one highlighted.
      const timers=el('div','duel-timers');
      [d.challenger,d.defender].forEach(ppid=>{
        const active=d.control===ppid;
        const t=el('div','dt-clock'+(active?' running':'')); t.style.setProperty('--pc',colorOf(ppid));
        t.innerHTML=`<span class="dt-name">${nameOf(ppid)}${ppid===pid?' (you)':''}</span><span class="dt-time">${d.time[ppid]}</span>`;
        timers.append(t);
      });
      w.append(timers);
      // Photo clue, height-constrained so it never forces scrolling.
      const frame=el('div','img-frame player-clue'); w.append(frame);
      loadImageInto(frame, Object.assign({cat:d.cat}, d.answer));
      const hint=el('p','note dim'); hint.style.textAlign='center'; hint.style.margin='8px 0 0';
      hint.textContent = amInvolved ? 'Say your answer out loud — the judge marks it.' : 'Watch the duel on the main screen.';
      w.append(hint);
    } else if(cq && cq.sub==='countdown' && cq.duel){
      const d=cq.duel;
      w.append(el('div','turn-banner compact',`${nameOf(d.challenger)} vs ${nameOf(d.defender)}`));
      w.append(centerCard(`<div class="big-emoji">${cq.count>0?cq.count:'GO!'}</div><p class="note">${d.cat}</p>`));
    } else {
      w.append(centerCard(`<div class="big-emoji">🎯</div><h2>${cq&&cq.conqueror!=null?nameOf(cq.conqueror):'…'}'s turn</h2><p class="note">Choosing a tile to attack. Watch the main screen.</p>`));
    }
    w.append(miniScoreStrip(st,pid));
    app.append(w); return;
  }

  if(st.phase==='gameover'){
    const win=st.winner;
    const iWon = win===pid;
    w.append(centerCard(`<div class="big-emoji">${iWon?'🏆':'🎉'}</div><h2>${iWon?'You win!':nameOf(win)+' wins!'}</h2><p class="note">Thanks for playing.</p>`));
    app.append(w); return;
  }

  // fallback
  w.append(centerCard(`<p class="note">Syncing…</p>`));
  app.append(w);
}
function centerCard(html){ const c=el('div','center-card'); c.innerHTML=html; return c; }

// Player's own draft grid — only their legal picks are tappable.
function buildPlayerDraftGrid(st,pid){
  const grid=el('div','grid-board'); grid.style.gridTemplateColumns=`repeat(${st.cols},1fr)`;
  const pickable=new Set(GD.draftPickable(pid).map(b=>b.id));
  st.blocks.forEach(b=>{
    const t=el('div','gb');
    if(b.owner===pid){ t.classList.add('mine'); t.style.setProperty('--pc',colorOf(pid)); t.innerHTML=`<span class="cat-name">${b.cat}</span><span class="chk">✓</span>`; }
    else if(b.owner!==null){ t.classList.add('taken'); t.style.setProperty('--pc',colorOf(b.owner)); t.innerHTML=`<span class="cat-name">${b.cat}</span><span class="lock">🔒</span>`; }
    else { t.innerHTML=`<span class="cat-name">${b.cat}</span>`; if(pickable.has(b.id)){ t.classList.add('pickable'); t.onclick=()=>{ GD.sfx&&GD.sfx('pick'); playerAct('draftPick',{blockId:b.id}); }; } else { t.classList.add('faded'); } }
    grid.append(t);
  });
  return grid;
}
// Read-only mini board for players when it's not their turn.
function miniBoardView(st){
  const grid=el('div','grid-board mini'); grid.style.gridTemplateColumns=`repeat(${st.cols},1fr)`;
  st.blocks.forEach(b=>{
    const t=el('div','gb mini-gb');
    if(b.owner!==null){ t.style.setProperty('--pc',colorOf(b.owner)); t.classList.add('owned'); }
    grid.append(t);
  });
  return grid;
}
function miniScoreStrip(st,pid){
  const strip=el('div','mini-scores');
  const counts=st.players.map(p=>({p,n:GD.tileCount(p.id)})).sort((a,b)=>b.n-a.n);
  const lead=counts[0]?counts[0].n:0;
  counts.forEach(({p,n})=>{
    const chip=el('span','ms-chip'+(p.id===pid?' me':''));
    chip.style.setProperty('--pc',p.color);
    chip.innerHTML=`<span class="ms-dot"></span>${p.name}${n===lead&&n>0?' 👑':''} <b>${n}</b>`;
    strip.append(chip);
  });
  return strip;
}

// --- Photo connectivity self-check ---------------------------------------
// Silently tests whether Wikipedia images are reachable from THIS device/way
// of opening the file. If not, shows a clear banner so blank photos are never
// a silent mystery. Runs once, a moment after load.
function showPhotoBanner(msg){
  let b=document.getElementById('photoBanner');
  if(!b){ b=document.createElement('div'); b.id='photoBanner'; b.className='photo-banner'; document.body.appendChild(b); }
  b.innerHTML=msg+' <button onclick="this.parentNode.remove()">✕</button>';
}
async function photoSelfCheck(){
  try{
    const src=await GD.fetchImage('Earth');           // a page guaranteed to have an image
    if(src){
      // also confirm the image element can actually load it
      const okImg=await new Promise(res=>{ const im=new Image(); im.onload=()=>res(true); im.onerror=()=>res(false); im.src=src; setTimeout(()=>res(false),6000); });
      if(!okImg) showPhotoBanner('⚠️ Photos found but blocked from displaying. If you opened this file directly, try a different browser, or host the file online.');
    } else {
      showPhotoBanner('⚠️ Can’t reach Wikipedia for photos. Check your internet connection. (Some networks/VPNs or opening the file offline will block images.)');
    }
  }catch(e){
    showPhotoBanner('⚠️ Photos can’t load on this device right now — Wikipedia couldn’t be reached.');
  }
}
setTimeout(photoSelfCheck, 1200);

// #1: if opened with #judge=CODE (from the host's "Open Judge Screen" button),
// auto-join as judge so the host doesn't have to retype the code.
(function autoJudge(){
  try{
    const h=location.hash||'';
    const m=h.match(/judge=([A-Z0-9]{4})/i);
    if(m){
      const code=m[1].toUpperCase();
      GD.ROLE='judge'; GD.soloMode=false;
      GD.joinRoom(code,'Judge','judge',(ok)=>{ if(ok){ showToast('Judge connected'); renderJudge(); } else { renderMenu(); } });
      return;
    }
    // #2: a player who refreshed mid-game can auto-rejoin their saved session.
    const savedRoom=localStorage.getItem('gd_room');
    const savedRole=localStorage.getItem('gd_role');
    const savedName=localStorage.getItem('gd_name');
    if(savedRoom && (savedRole==='player'||savedRole==='judge')){
      // offer a quick reconnect instead of forcing code re-entry
      renderReconnectPrompt(savedRoom,savedRole,savedName);
      return;
    }
  }catch(e){}
  renderMenu();
})();

function renderReconnectPrompt(room,role,name){
  app.innerHTML='';
  const w=el('div','wrap');
  w.append(el('h2',null,'Welcome back'));
  w.insertAdjacentHTML('beforeend',`<p class="note">Reconnect to your game as <b>${role==='judge'?'Judge':(name||'Player')}</b> (room ${room})?</p>`);
  const go=el('button','btn good','🔄 Rejoin Game');
  go.onclick=()=>{ GD.ROLE=role; GD.soloMode=false; go.disabled=true; go.textContent='Rejoining…';
    GD.joinRoom(room,name||'Player',role,(ok)=>{ if(ok){ role==='judge'?renderJudge():renderPlayer(); } else { go.disabled=false; go.textContent='🔄 Rejoin Game'; showToast('Could not rejoin — host may have ended the game'); } }); };
  w.append(go);
  const fresh=el('button','btn ghost small','Start fresh (main menu)');
  fresh.onclick=()=>{ try{localStorage.removeItem('gd_room');}catch(e){} renderMenu(); };
  w.append(fresh);
  app.append(w);
}
})();
