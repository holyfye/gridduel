<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GRID DUEL — Party Showdown</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800;900&display=swap');

:root{
  --bg:#0a0e27;
  --bg2:#141a3a;
  --panel:#1a2147;
  --ink:#eef2ff;
  --muted:#8b96c9;
  --gold:#ffd23f;
  --gold2:#ffb627;
  --hot:#ff3864;
  --cool:#2de2e6;
  --good:#3ddc97;
  --bad:#ff5c5c;
  --line:rgba(255,255,255,.08);
  --p1:#ff3864; --p2:#2de2e6; --p3:#3ddc97; --p4:#ffd23f;
  --p5:#b76eff; --p6:#ff8c42; --p7:#54c6eb; --p8:#f15bb5;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Archivo',system-ui,sans-serif;
  background:radial-gradient(circle at 20% 0%,#1a2150 0%,var(--bg) 55%);
  color:var(--ink);
  overflow-x:hidden;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1100px;margin:0 auto;padding:16px;min-height:100vh;display:flex;flex-direction:column}

/* ---- Display helpers ---- */
.hidden{display:none !important}
h1,h2,h3{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.5px;text-transform:uppercase}
.mono{font-variant-numeric:tabular-nums}

/* ---- Landing ---- */
.brand{text-align:center;margin:6vh 0 4vh}
.brand .logo{
  font-family:'Anton';font-size:clamp(48px,12vw,110px);line-height:.9;
  background:linear-gradient(180deg,#fff 0%,var(--gold) 60%,var(--gold2) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.35));
}
.brand .sub{color:var(--muted);font-size:clamp(13px,3.5vw,18px);letter-spacing:4px;text-transform:uppercase;margin-top:6px;font-weight:600}
.tile-grid-deco{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:320px;margin:18px auto 0}
.tile-grid-deco i{aspect-ratio:1;border-radius:6px;background:var(--panel);display:block;animation:pulse 3s infinite}
.tile-grid-deco i:nth-child(3n){background:rgba(255,210,63,.25)}
.tile-grid-deco i:nth-child(5n){background:rgba(45,226,230,.2)}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

.menu{display:flex;flex-direction:column;gap:14px;max-width:420px;margin:10px auto;width:100%}
.btn{
  border:none;border-radius:16px;padding:18px 22px;font-family:'Archivo';font-weight:800;
  font-size:18px;cursor:pointer;transition:transform .12s,box-shadow .12s;color:#0a0e27;
  background:linear-gradient(180deg,var(--gold),var(--gold2));
  box-shadow:0 6px 0 #b3801a,0 12px 22px rgba(0,0,0,.4);
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b3801a}
.btn.alt{background:linear-gradient(180deg,#2de2e6,#13b8bc);box-shadow:0 6px 0 #0c7d80,0 12px 22px rgba(0,0,0,.4);color:#03222a}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none;font-weight:600}
.btn.ghost:active{transform:translateY(2px)}
.btn.small{padding:12px 16px;font-size:15px;border-radius:12px}
.btn.hot{background:linear-gradient(180deg,#ff5d7d,var(--hot));box-shadow:0 6px 0 #a51a35,0 12px 22px rgba(0,0,0,.4);color:#fff}
.btn.good{background:linear-gradient(180deg,#5ef0b0,var(--good));box-shadow:0 6px 0 #1f8d5f;color:#04331f}
.btn:disabled{opacity:.4;pointer-events:none}

.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:700}
.field input{
  width:100%;background:var(--bg2);border:2px solid var(--line);border-radius:12px;
  padding:14px 16px;color:var(--ink);font-size:18px;font-family:'Archivo';font-weight:700;outline:none;
}
.field input:focus{border-color:var(--gold)}
.code-input{text-align:center;font-size:34px !important;letter-spacing:10px;font-family:'Anton' !important}

.note{color:var(--muted);font-size:13px;line-height:1.5;margin-top:8px}
.back{color:var(--muted);background:none;border:none;font-size:14px;cursor:pointer;padding:8px;font-weight:600;display:inline-flex;align-items:center;gap:6px}

/* ---- Room code display ---- */
.roomcode{text-align:center;margin:20px 0}
.roomcode .label{font-size:12px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;font-weight:700}
.roomcode .code{font-family:'Anton';font-size:64px;letter-spacing:14px;color:var(--gold);margin:6px 0;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.status-pill{display:inline-flex;align-items:center;gap:8px;background:var(--bg2);padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700;color:var(--muted)}
.status-pill .dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}
.status-pill.live .dot{background:var(--good);box-shadow:0 0 8px var(--good)}
.status-pill.live{color:var(--good)}

/* ---- Player setup ---- */
.players-list{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.player-row{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:12px;padding:8px 10px;border-left:6px solid var(--pc)}
.player-row input{flex:1;background:none;border:none;color:var(--ink);font-size:17px;font-weight:700;font-family:'Archivo';outline:none}
.player-row .swatch{width:24px;height:24px;border-radius:6px;background:var(--pc);flex-shrink:0}
.player-row .rm{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 6px}

/* =========================================================
   STAGE SCREEN (the big shared display)
   ========================================================= */
#stageScreen{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:clamp(6px,1.5vmin,14px);overflow:hidden}
.stage-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(4px,1vmin,12px);flex-shrink:0}
.stage-head .mini-logo{font-family:'Anton';font-size:clamp(15px,2.4vmin,22px);color:var(--gold);letter-spacing:1px}
.stage-head .roundinfo{font-size:clamp(10px,1.5vmin,13px);color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px}

/* Grid of category tiles */
.board{
  display:grid;gap:8px;flex:1;align-content:center;
}
.btile{
  position:relative;border-radius:12px;padding:8px 6px;min-height:70px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  font-weight:800;font-size:11px;line-height:1.15;
  background:var(--panel);border:2px solid var(--line);
  transition:transform .25s,box-shadow .25s,background .4s;
  overflow:hidden;
}
.btile .cat-name{position:relative;z-index:2;text-transform:uppercase;letter-spacing:.3px}
.btile .owner-tag{position:relative;z-index:2;font-size:9px;margin-top:4px;opacity:.85;font-weight:700}
.btile.owned{color:#fff;border-color:transparent}
.btile.owned::before{content:'';position:absolute;inset:0;background:var(--oc);opacity:.92;z-index:1}
.btile.active{transform:scale(1.06);box-shadow:0 0 0 3px var(--gold),0 10px 30px rgba(0,0,0,.5);z-index:5}
.btile.dueling{animation:duelflash 1s infinite}
@keyframes duelflash{0%,100%{box-shadow:0 0 0 3px var(--hot)}50%{box-shadow:0 0 0 6px var(--gold)}}

/* Question view on stage */
.qstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:10px}
.qstage .cat-banner{font-family:'Anton';font-size:clamp(22px,6vw,40px);color:var(--gold);text-transform:uppercase;letter-spacing:1px}
.qstage .img-frame{
  width:min(72vw,420px);aspect-ratio:1;border-radius:20px;overflow:hidden;
  background:var(--bg2);border:4px solid var(--line);
  display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.qstage .img-frame img,.qstage .img-frame .clue-img{width:100%;height:100%;object-fit:cover;animation:imgFade .35s ease}
@keyframes imgFade{from{opacity:0}to{opacity:1}}
.qstage .img-frame .ld{color:var(--muted);font-size:14px;font-weight:700}
.img-fallback{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:radial-gradient(circle at 50% 35%,#222a55,#141a3a)}
.img-fallback .fb-q{font-family:'Anton';font-size:64px;color:var(--gold);opacity:.5;line-height:1}
.img-fallback .fb-cat{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);text-align:center;padding:0 12px}
.photo-banner{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);max-width:92vw;z-index:90;
  background:#3a1620;border:1px solid var(--bad);color:#ffd9df;border-radius:12px;padding:12px 16px;font-size:13px;font-weight:600;line-height:1.5;
  box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px}
.photo-banner button{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:6px;width:24px;height:24px;cursor:pointer;font-weight:800;flex-shrink:0}
.qstage .qcount{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:2px;text-transform:uppercase}

/* Duel banner */
.duel-banner{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.duel-side{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 16px;border-radius:14px;background:var(--bg2);border:2px solid var(--sc);min-width:110px}
.duel-side .nm{font-weight:800;font-size:15px;color:#fff}
.duel-side .clk{font-family:'Anton';font-size:30px}
.duel-side.active-turn{box-shadow:0 0 0 3px var(--gold),0 0 20px rgba(255,210,63,.5);transform:scale(1.05)}
.duel-side.active-turn .clk{color:var(--gold)}
.duel-vs{font-family:'Anton';font-size:24px;color:var(--hot)}

/* Timer bars */
.clk.low{color:var(--bad);animation:tick .5s infinite}
@keyframes tick{0%,100%{opacity:1}50%{opacity:.5}}

/* Winner overlay */
.overlay{position:fixed;inset:0;background:rgba(5,8,25,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;gap:16px;padding:20px;text-align:center}
.overlay .crown{font-size:70px}
.overlay h1{font-size:clamp(32px,9vw,64px);color:var(--gold)}
.overlay .wname{font-family:'Anton';font-size:clamp(40px,11vw,80px);color:#fff}

/* =========================================================
   JUDGE / ADMIN SCREEN
   ========================================================= */
#judgeScreen{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding:16px;gap:14px;max-width:680px;margin:0 auto;width:100%}
.judge-head{display:flex;justify-content:space-between;align-items:center}
.judge-head .ttl{font-family:'Anton';font-size:22px;color:var(--cool);letter-spacing:1px}
.phase-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,26px)}
.phase-card .ph-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
/* Big duel answer + controls feel substantial on desktop, not lost in whitespace */
@media(min-width:560px){
  .answer-reveal .a-name{font-size:52px}
  .judge-actions .btn{padding:26px;font-size:22px}
  .duel-clocks{max-width:560px;margin-left:auto;margin-right:auto}
}

.answer-reveal{text-align:center;background:linear-gradient(180deg,var(--bg2),var(--panel));border:2px solid var(--gold);border-radius:18px;padding:22px 16px;margin:4px 0}
.answer-reveal .a-label{font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;font-weight:800}
.answer-reveal .a-name{font-family:'Anton';font-size:clamp(28px,8vw,46px);color:#fff;margin-top:6px;line-height:1}
.answer-reveal .a-img{width:120px;height:120px;border-radius:14px;object-fit:cover;margin:12px auto 0;border:2px solid var(--line);display:block}

.judge-turn-info{text-align:center;font-size:15px;color:var(--muted);font-weight:700;margin-bottom:4px}
.judge-turn-info b{color:var(--gold);font-size:20px}
.clk-big{font-family:'Anton';font-size:42px;text-align:center}
.clk-big.low{color:var(--bad)}

.judge-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.judge-actions.solo{grid-template-columns:1fr}
.judge-actions .btn{font-size:20px;padding:22px}

.tile-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;max-height:50vh;overflow-y:auto;padding-right:4px}
.tp-tile{position:relative;border-radius:12px;padding:12px 7px;font-size:10px;font-weight:800;text-align:center;background:#161d3f;border:1.5px solid rgba(255,255,255,.07);cursor:pointer;text-transform:uppercase;line-height:1.15;color:#cdd5f5;min-height:60px;display:flex;flex-direction:column;justify-content:center;gap:4px;overflow:hidden;transition:transform .2s}
.tp-tile .o{font-size:9px;opacity:.9;font-weight:800;letter-spacing:.5px}
.tp-tile.owned{color:#fff;border-color:transparent;
  background:linear-gradient(180deg,var(--pc) 0 4px,transparent 4px),linear-gradient(160deg,color-mix(in srgb,var(--pc) 30%,#0e1430),color-mix(in srgb,var(--pc) 15%,#0e1430))}
.tp-tile.owned .o{color:var(--pc);filter:brightness(1.4)}
.tp-tile.owned::after{content:'🎯';position:absolute;top:3px;right:5px;font-size:11px;border:none}
.tp-tile.mine{outline:3px solid var(--gold)}
.tp-tile:active{transform:scale(.95)}
.tp-tile.pickable{border-color:var(--gold);animation:pulse 1.5s infinite}

.scoreboard{display:flex;flex-direction:column;gap:6px}
.sb-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg2);border-radius:10px;border-left:5px solid var(--pc)}
.sb-row .nm{flex:1;font-weight:800;font-size:15px}
.sb-row .ct{font-family:'Anton';font-size:20px;color:var(--gold)}
.sb-row.out{opacity:.4}
.sb-row.out .nm{text-decoration:line-through}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);color:var(--ink);padding:14px 22px;border-radius:14px;font-weight:700;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center;animation:toastin .3s}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}}

.help-box{background:rgba(45,226,230,.08);border:1px solid rgba(45,226,230,.25);border-radius:12px;padding:14px;font-size:13px;line-height:1.6;color:var(--ink)}
.help-box b{color:var(--cool)}
.divider{height:1px;background:var(--line);margin:14px 0}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flag-emoji{font-size:13px}
details{background:var(--bg2);border-radius:12px;padding:4px 14px;margin-top:8px}
summary{cursor:pointer;font-weight:700;padding:10px 0;font-size:14px;color:var(--cool)}
details p,details li{font-size:13px;line-height:1.6;color:var(--muted);margin:4px 0}
details ul{padding-left:18px}

/* ---- Setup: board size picker ---- */
.size-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.cat-pick-grid{display:flex;flex-direction:column;gap:6px;max-height:54vh;overflow:auto;padding-right:2px}
.cat-pick{display:flex;align-items:center;gap:10px;background:var(--bg2);border:2px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;transition:border-color .15s,background .15s}
.cat-pick.on{border-color:var(--good);background:rgba(61,220,151,.1)}
.cat-pick .cp-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex-shrink:0;color:var(--good)}
.cat-pick.on .cp-check{border-color:var(--good);background:var(--good);color:#04331f}
.cat-pick .cp-name{flex:1;font-weight:800;font-size:14px}
.cat-pick .cp-count{font-size:11px;color:var(--muted);background:rgba(255,255,255,.06);padding:2px 9px;border-radius:99px;font-weight:700}
.size-opt{background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:12px 6px;color:var(--ink);font-family:'Archivo';font-weight:800;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.size-opt small{font-size:10px;color:var(--muted);font-weight:600}
.size-opt.on{border-color:var(--gold);background:rgba(255,210,63,.12);color:var(--gold)}

/* ---- Draft screen ---- */
.draft-screen{display:flex;flex-direction:column;gap:12px;padding:8px 0}
.interstitial{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;min-height:70vh}
.interstitial .pass-icon{font-size:54px;animation:nudge 1.4s infinite}
@keyframes nudge{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.interstitial .pass-to{color:var(--muted);font-size:14px;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.interstitial .pass-name{font-family:'Anton';font-size:clamp(36px,11vw,64px);line-height:1}
.interstitial .btn{margin-top:18px}
.draft-head{text-align:center}
.draft-head .dh-name{font-family:'Anton';font-size:26px}
.draft-head .dh-sub{color:var(--muted);font-size:13px;font-weight:600;margin-top:2px}
.draft-head .dh-sub b{color:var(--gold)}
.draft-flash{text-align:center;background:rgba(255,92,92,.15);border:1px solid var(--bad);color:#ffd0d0;border-radius:10px;padding:8px;font-size:13px;font-weight:700}
.draft-prog{display:flex;gap:6px;justify-content:center;margin-top:6px}
.pdot{width:12px;height:12px;border-radius:50%;opacity:.3}
.pdot.active{opacity:1;box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.pdot.done{opacity:.7}

/* ---- Grid board (shared by draft + stage) ---- */
/* ===== BOARD TILES — contained ownership, no glow bleed ===== */
.grid-board{display:grid;gap:9px;width:100%}
.grid-board.big{gap:clamp(4px,0.8vmin,11px);flex:1;height:100%;min-height:0}
/* On the stage, tiles fill their grid cell (rows are sized to fit the screen).
   Draft grid keeps square-ish tiles via aspect-ratio. */
.grid-board.big .gb{aspect-ratio:auto;height:100%;min-height:0}
.gb{position:relative;aspect-ratio:1;border-radius:14px;
  background:#161d3f;border:1.5px solid rgba(255,255,255,.07);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  font-size:clamp(8px,1.3vmin,15px);font-weight:800;line-height:1.15;padding:5px;text-transform:uppercase;letter-spacing:.3px;
  color:#cdd5f5;overflow:hidden;
  transition:transform .28s cubic-bezier(.2,.9,.3,1.2), border-color .25s, background .35s, opacity .25s;}
.gb span{position:relative;z-index:3}
.gb .ot{font-size:clamp(7px,1vmin,12px);font-weight:800;margin-top:3px;opacity:.85;letter-spacing:.6px}
.gb .chk{font-size:clamp(12px,2vmin,18px);margin-top:3px}
.gb .lock{font-size:clamp(9px,1.3vmin,13px);opacity:.5;margin-top:2px}

/* OWNED: muted tinted fill + solid color top band, fully contained */
.gb.owned, .gb.mine{
  color:#fff;border-color:transparent;
  background:
    linear-gradient(180deg, var(--pc) 0 5px, transparent 5px),                 /* top ownership band */
    linear-gradient(160deg, color-mix(in srgb,var(--pc) 34%, #11173200) 0%, color-mix(in srgb,var(--pc) 16%, #0e1430) 100%);
}
.gb.owned .cat-name, .gb.mine .cat-name{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.gb.owned .ot{color:var(--pc);filter:brightness(1.35) saturate(1.2)}
/* a thin solid inner ring keeps the color crisp without bleeding onto neighbors */
.gb.owned::after, .gb.mine::after{content:'';position:absolute;inset:0;border-radius:14px;
  border:1.5px solid color-mix(in srgb,var(--pc) 55%, transparent);pointer-events:none;z-index:2}

/* DRAFT: my newly-claimed tiles in the secret draft */
.gb.mine{background:
    linear-gradient(180deg, var(--pc) 0 5px, transparent 5px),
    linear-gradient(160deg, color-mix(in srgb,var(--pc) 45%, #0e1430) 0%, color-mix(in srgb,var(--pc) 24%, #0e1430) 100%);}
.gb.mine .chk{color:#fff}

/* TAKEN by someone else (draft, hidden owner) */
.gb.taken{background:#20264a;color:#5b659a;border-color:transparent}
.gb.taken::after{display:none}

/* FADED / not currently selectable */
.gb.faded{opacity:.38;filter:saturate(.6)}

/* PICKABLE (draft) — animated INSET dashed ring, stays inside the tile */
.gb.pickable{cursor:pointer;border-color:transparent;color:#fff;
  background:linear-gradient(160deg,#1d2752,#161d3f);}
.gb.pickable::after{content:'';position:absolute;inset:3px;border-radius:11px;
  border:2px dashed var(--gold);pointer-events:none;z-index:4;
  animation:dashSpin 14s linear infinite, dashPulse 1.6s ease-in-out infinite}
.gb.pickable:active{transform:scale(.93)}
@keyframes dashPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes dashSpin{to{background-position:200px 0}}

/* CONQUEROR'S OWN TILES — bright crown ring, raised */
.gb.conq{transform:translateY(-2px) scale(1.03);z-index:5;border-color:transparent}
.gb.conq::after{content:'';position:absolute;inset:0;border-radius:14px;
  border:2.5px solid var(--gold);pointer-events:none;z-index:4;
  box-shadow:inset 0 0 14px rgba(255,210,63,.45)}     /* INSET glow only */
.gb.conq::before{content:'⚔';position:absolute;top:3px;right:5px;font-size:11px;z-index:5;opacity:.9}

/* ATTACKABLE TARGETS — pulsing inset danger ring + dim scrim so they pop */
.gb.target{cursor:pointer;z-index:6}
.gb.target::after{content:'';position:absolute;inset:0;border-radius:14px;
  border:2.5px solid #ff5470;pointer-events:none;z-index:4;
  box-shadow:inset 0 0 16px rgba(255,84,112,.5);
  animation:targetPulse 1.1s ease-in-out infinite}
.gb.target::before{content:'🎯';position:absolute;top:3px;right:5px;font-size:12px;z-index:5}
@keyframes targetPulse{0%,100%{opacity:.7}50%{opacity:1}}
.gb.target:active{transform:scale(.95)}

/* tile capture pop */
.gb.just-won{animation:capturePop .55s cubic-bezier(.2,.9,.3,1.4)}
@keyframes capturePop{0%{transform:scale(.6);opacity:.3}60%{transform:scale(1.12)}100%{transform:scale(1)}}

.board-wrap{flex:1;display:flex;flex-direction:column;gap:clamp(6px,1.2vmin,14px);justify-content:center;min-height:0}
.stage-flash{text-align:center;font-family:'Anton';font-size:clamp(15px,3vmin,30px);padding:clamp(2px,0.6vmin,6px);flex-shrink:0;color:var(--gold);
  letter-spacing:.5px;text-shadow:0 2px 12px rgba(255,210,63,.35);animation:flashIn .4s ease}
@keyframes flashIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.stage-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.big-emoji{font-size:60px}

.mini-scores{display:flex;flex-wrap:wrap;gap:clamp(4px,1vmin,7px);justify-content:center;flex-shrink:0}
.ms-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(20,26,58,.8);border-radius:99px;padding:clamp(3px,0.8vmin,6px) clamp(8px,1.5vmin,14px);font-size:clamp(10px,1.5vmin,12px);font-weight:800;border:1px solid rgba(255,255,255,.06)}
.ms-chip .sw{width:11px;height:11px;border-radius:4px;background:var(--pc);box-shadow:0 0 0 2px color-mix(in srgb,var(--pc) 30%, transparent)}
.ms-chip b{color:#fff;background:var(--pc);padding:1px 7px;border-radius:99px;font-size:11px;margin-left:2px}
.ms-chip.out{opacity:.4;text-decoration:line-through}

/* ---- Judge conquest ---- */
.conq-name{font-family:'Anton';font-size:28px;margin:4px 0 8px}
.duel-clocks{display:flex;gap:10px;margin-bottom:10px}
.dc{flex:1;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;border-left:6px solid var(--sc);transition:box-shadow .25s,transform .25s}
.dc span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.dc b{font-family:'Anton';font-size:30px}
.dc b.low{color:var(--bad)}
.dc.on{box-shadow:inset 0 0 0 2px var(--gold);transform:translateY(-2px)}

/* ---- Duel countdown overlay ---- */
.countdown{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;

.countdown .cd-vs{font-family:'Anton';font-size:clamp(20px,5vw,34px);color:var(--muted);letter-spacing:2px;margin-bottom:6px;text-transform:uppercase}
.countdown .cd-vs b{color:#fff}
.countdown .cd-cat{font-family:'Anton';font-size:clamp(24px,7vw,46px);color:var(--gold);margin-bottom:18px;text-transform:uppercase;letter-spacing:1px}
.countdown .cd-num{font-family:'Anton';font-size:clamp(90px,30vw,200px);line-height:.9;color:#fff;
  text-shadow:0 0 40px rgba(255,210,63,.5)}
.cd-num.go{color:var(--good)}
.cd-pop{animation:cdPop .9s cubic-bezier(.2,.8,.2,1)}

.snd-toggle.off{opacity:.5}

#stageScreen,#judgeScreen{animation:viewFade .35s ease}

.qstage{animation:viewFade .4s ease}

.lobby-player .lp-name{flex:1;font-weight:800}
.lobby-player .lp-tag{font-size:11px;color:var(--good);font-weight:800;text-transform:uppercase;letter-spacing:1px}
.note.dim{opacity:.6}
.player-wrap{min-height:100vh;min-height:100dvh}
.player-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.player-head .logo-sm{font-family:'Anton';color:var(--gold);font-size:16px;letter-spacing:1px}
.center-card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:40px 16px;min-height:50vh}

.img-frame.player-clue{width:min(86vw,420px);margin:0 auto}

<script id="appScript">
/* =====================================================================
   GRID DUEL — Territory Showdown  (engine)
   Rules (corrected + expanded per spec):
   - Board is a rows x cols GRID of category blocks (orthogonal adjacency).
   - DRAFT (secret, pass-the-device): each player claims a CONTIGUOUS
     territory of K blocks (K = total/players, remainder spread to early
     pickers). Picks hidden from other players between turns.
   - CONQUEST: a random border block is chosen; its owner becomes the
     CONQUEROR. They challenge an adjacent enemy block (a DUEL). Win =>
     take that one tile, then continue challenging or stop. On stop (or a
     loss) a new random border owner becomes conqueror.
   - DUEL: both players get a fresh personal clock. Controller's clock
     ticks. Correct => hand control to opponent. Miss/Pass => keep control
     & keep burning your own time. Pictures keep coming until ONE clock
     hits 0 — that player LOSES the duel. (A single correct answer never
     ends a duel.)
   - A player owning 0 blocks is OUT. Game ends when one player owns ALL.
   ===================================================================== */
(function(){
'use strict';

const PCOLORS = ['#ff3864','#2de2e6','#3ddc97','#ffd23f','#b76eff','#ff8c42','#54c6eb','#f15bb5'];

const $ = (id)=>document.getElementById(id);
const app = $('app');

// ---------- utils ----------
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function rand(arr){return arr[(Math.random()*arr.length)|0];}

// ---------- AUDIO (synthesized, no files — packaging-friendly) ----------
let audioCtx=null, soundOn=true;
function ac(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
function tone(freq,dur,type,vol,when){
  if(!soundOn) return; const c=ac(); if(!c) return;
  const t=(when||c.currentTime);
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol||0.18,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
}
function sfx(name){
  if(!soundOn) return; const c=ac(); if(!c) return; const n=c.currentTime;
  switch(name){
    case 'pick':    tone(520,0.07,'triangle',0.12); break;
    case 'select':  tone(660,0.08,'triangle',0.14); tone(880,0.08,'triangle',0.1,n+0.05); break;
    case 'correct': tone(660,0.09,'sine',0.16); tone(990,0.13,'sine',0.16,n+0.08); break;
    case 'pass':    tone(220,0.16,'sawtooth',0.14); break;
    case 'tick':    tone(1500,0.03,'square',0.05); break;
    case 'lowtick': tone(1850,0.05,'square',0.09); break;
    case 'timeup':  tone(180,0.5,'sawtooth',0.2); tone(120,0.7,'sawtooth',0.18,n+0.12); break;
    case 'capture': tone(523,0.1,'sine',0.16); tone(659,0.1,'sine',0.16,n+0.09); tone(784,0.18,'sine',0.18,n+0.18); break;
    case 'count':   tone(440,0.13,'triangle',0.18); break;
    case 'go':      tone(880,0.25,'sine',0.2); tone(1320,0.3,'sine',0.18,n+0.05); break;
    case 'win':     [523,659,784,1047].forEach((f,i)=>tone(f,0.32,'sine',0.2,n+i*0.13)); break;
    case 'defend':  tone(330,0.18,'square',0.14); tone(247,0.22,'square',0.12,n+0.1); break;
  }
}
function setSound(on){ soundOn=on; if(on){ const c=ac(); if(c&&c.state==='suspended') c.resume(); } }
function getSound(){ return soundOn; }

// ===================================================================
// CONTENT  (mutable so a custom "question pack" can replace the default)
// ===================================================================
let CONTENT = (typeof GAME_CONTENT!=='undefined') ? GAME_CONTENT : {};
function getList(cat){ return CONTENT[cat] || []; }
// answers may be legacy [name,wiki] tuples OR {name,wiki,img} objects
function normAnswer(a){
  if(Array.isArray(a)) return {name:a[0], wiki:a[1]||null, img:null};
  return {name:a.name, wiki:a.wiki||null, img:a.img||null};
}
function setContent(obj){ if(obj && typeof obj==='object') CONTENT=obj; }

// ===================================================================
// STATE
// ===================================================================
let STATE=null;

function freshState(players, gridCats, rows, cols, opts){
  opts=opts||{};
  const blocks = gridCats.map((cat,i)=>({
    id:i, r:(i/cols)|0, c:i%cols, cat,
    owner:null,
    order: shuffle([...Array(getList(cat).length).keys()]),
    qIndex:0,
  }));
  const total=blocks.length, n=players.length;
  const base=Math.floor(total/n), rem=total%n;
  const order=shuffle(players.map(p=>p.id));
  const quota={}; order.forEach((pid,idx)=>{ quota[pid]=base+(idx<rem?1:0); });
  const claimed={}; order.forEach(pid=>{ claimed[pid]=0; });
  return {
    rows, cols, blocks,
    players: players.map(p=>({...p,out:false})),
    duelSeconds: opts.duelSeconds||45,
    passPenalty: (opts.passPenalty!=null)?opts.passPenalty:3,
    phase:'draft',
    // snake draft: pick ONE block per turn, rotating through players each round
    draft:{ order, quota, claimed, round:0, ptr:0, dir:1, picker:order[0] },
    conquest:null,
    winner:null,
    flash:null,        // transient message for the stage
  };
}

// ---------- grid helpers ----------
function blockAt(r,c){ if(r<0||c<0||r>=STATE.rows||c>=STATE.cols) return null; return STATE.blocks[r*STATE.cols+c]; }
function neighbors(b){ return [blockAt(b.r-1,b.c),blockAt(b.r+1,b.c),blockAt(b.r,b.c-1),blockAt(b.r,b.c+1)].filter(Boolean); }
function ownedBy(pid){ return STATE.blocks.filter(b=>b.owner===pid); }
function tileCount(pid){ return ownedBy(pid).length; }
// enemy blocks adjacent to any block owned by pid
function attackTargets(pid){
  const set=new Set();
  ownedBy(pid).forEach(b=> neighbors(b).forEach(nb=>{ if(nb.owner!==pid && nb.owner!==null) set.add(nb.id); }));
  return [...set].map(id=>STATE.blocks[id]);
}
function isBorder(b){ return b.owner!==null && neighbors(b).some(nb=>nb.owner!==null && nb.owner!==b.owner); }

// ===================================================================
// CONNECTION  (PeerJS — multi-client hub: 1 host screen + N player phones)
// ===================================================================
let peer=null, ROLE=null, ROOM=null, connLive=false;
let hbTimer=null, reconnectTimer=null, joinAttempts=0;
// HOST side: a map of all connected player devices, keyed by a clientId.
let peers={};            // clientId -> { conn, name, playerId, alive }
// PLAYER side: the single connection back to the host.
let conn=null;
let MYID=null;           // this device's clientId (player side)
let MYNAME=null;         // this device's chosen name (player side)
let MYROLE='player';     // this device's role: 'player' | 'judge'
let onLobbyChange=null;  // host callback when roster changes
const PREFIX='GRIDDUEL2-';
const PEER_CFG={ config:{ iceServers:[
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'stun:stun1.l.google.com:19302'},
  {urls:'stun:global.stun.twilio.com:3478'}
]}, debug:1 };
function makeCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=c[(Math.random()*c.length)|0];return s;}
function makeClientId(){ return 'c'+Math.random().toString(36).slice(2,9); }

// Broadcast a message to every connected player device (host only).
function broadcast(m){
  for(const id in peers){ const p=peers[id]; if(p.conn&&p.conn.open){ try{p.conn.send(m);}catch(e){} } }
}
// Send to one specific player device (host only).
function sendTo(clientId,m){ const p=peers[clientId]; if(p&&p.conn&&p.conn.open){ try{p.conn.send(m);}catch(e){} } }
// Player side: send a message to the host.
function sendHost(m){ if(conn&&conn.open){ try{conn.send(m);}catch(e){console.warn(e);} } }
// Back-compat shim used by older code paths (single-conn). Routes to broadcast.
function send(m){ broadcast(m); }

// --- Custom connection server (your own reliable host, replaces public broker) ---
function getServerURL(){ try{ return localStorage.getItem('gd_server')||''; }catch(e){ return _serverMem||''; } }
let _serverMem='';
function setServerURL(url){ _serverMem=url||''; try{ if(url) localStorage.setItem('gd_server',url); else localStorage.removeItem('gd_server'); }catch(e){} }
function peerOptions(){
  const base=JSON.parse(JSON.stringify(PEER_CFG));
  let url=getServerURL();
  // Auto: if no manual server set AND the game is being served over http(s)
  // (i.e. hosted, not opened as a local file), use THIS site's own origin as
  // the connection server. One deploy = game + server, zero config for players.
  if(!url){
    try{
      if(location && /^https?:$/.test(location.protocol) && location.host){ url=location.origin; }
    }catch(e){}
  }
  if(url){
    try{
      const u=new URL(url);
      base.host=u.hostname;
      base.secure=(u.protocol==='https:');
      base.port=u.port? Number(u.port) : (base.secure?443:80);
      base.path=(u.pathname && u.pathname!=='/')? u.pathname : '/peerjs';
    }catch(e){ showToast('Server URL looks invalid — using default'); }
  }
  return base;
}

function hostRoom(onReady){
  ROOM=makeCode();
  peer=new Peer(PREFIX+ROOM,peerOptions());
  peer.on('open',()=>onReady(ROOM));
  peer.on('connection',(c)=>{
    // Each incoming connection is one player device.
    c.on('open',()=>{
      // wait for the player to identify (join message) before adding to roster
      setConnLive(true);
    });
    c.on('data',(m)=>handlePlayerMsg(c,m));
    c.on('close',()=>{ markPeerDead(c); });
    c.on('error',()=>{ markPeerDead(c); });
  });
  peer.on('error',(e)=>{
    if(e.type==='unavailable-id'){ peer.destroy(); hostRoom(onReady); }
    else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'){ showToast('Reconnecting…'); setTimeout(()=>{ try{peer.reconnect();}catch(_){}}, 1500); }
    else { showToast('Connection issue: '+e.type); }
  });
  peer.on('disconnected',()=>{ try{peer.reconnect();}catch(_){} });
  startHeartbeat();
}

// HOST: handle a message from a player device.
function handlePlayerMsg(c, m){
  if(!m||!m.t) return;
  if(m.t==='hello'){
    // Player/Judge joining (or rejoining). role: 'player' | 'judge'
    let id=m.clientId;
    if(id && peers[id]){
      peers[id].conn=c; peers[id].alive=true; peers[id].name=m.name||peers[id].name; peers[id].role=m.role||peers[id].role||'player';
    } else {
      id = id || makeClientId();
      peers[id]={ conn:c, name:m.name||'Player', playerId:null, role:m.role||'player', alive:true };
    }
    c.__cid=id;
    sendTo(id,{t:'welcome', clientId:id});
    sendTo(id,{t:'state', s:STATE});
    if(onLobbyChange) onLobbyChange();
    refresh();
  } else if(m.t==='action'){
    // Only accept actions from the player whose turn/role it is (validated in applyAction).
    const id=c.__cid;
    applyAction(m.action, Object.assign({}, m.payload, {__from:id, __fromPlayerId: peers[id]?peers[id].playerId:null}));
  } else if(m.t==='ping'){
    const id=c.__cid; if(peers[id]) peers[id].alive=true;
    if(id) sendTo(id,{t:'pong'});
  }
}
function markPeerDead(c){
  const id=c.__cid; if(id&&peers[id]){ peers[id].alive=false; }
  if(onLobbyChange) onLobbyChange();
}
// Roster helpers (host)
function lobbyPlayers(){ return Object.keys(peers).filter(id=>(peers[id].role||'player')==='player').map(id=>({clientId:id, name:peers[id].name, playerId:peers[id].playerId, alive:peers[id].alive})); }
function lobbyJudges(){ return Object.keys(peers).filter(id=>peers[id].role==='judge').map(id=>({clientId:id, name:peers[id].name, alive:peers[id].alive})); }
function hasJudge(){ return Object.keys(peers).some(id=>peers[id].role==='judge'&&peers[id].alive); }
function assignPlayerSlots(){
  // Map connected PLAYER devices to player ids 0..n-1 in join order.
  const ids=Object.keys(peers).filter(id=>(peers[id].role||'player')==='player'&&peers[id].alive);
  let pid=0;
  ids.forEach(id=>{ peers[id].playerId=pid++; });
  return ids.length;
}
function clientIdToPlayerId(cid){ return peers[cid]?peers[cid].playerId:null; }
function setLobbyCallback(fn){ onLobbyChange=fn; }
// PLAYER/JUDGE: join a room with a chosen name and role ('player'|'judge').
function joinRoom(code, name, roleOrCb, cb){
  let role='player';
  if(typeof roleOrCb==='function'){ cb=roleOrCb; } else if(roleOrCb){ role=roleOrCb; }
  MYROLE=role;
  ROOM=code.toUpperCase();
  MYNAME=name||MYNAME||'Player';
  // Persist session so a refresh / wake can auto-rejoin without retyping.
  try{
    MYID = MYID || localStorage.getItem('gd_clientid') || makeClientId();
    localStorage.setItem('gd_clientid',MYID);
    localStorage.setItem('gd_room',ROOM);
    localStorage.setItem('gd_name',MYNAME);
    localStorage.setItem('gd_role',MYROLE);
  }catch(e){ MYID = MYID || makeClientId(); }
  joinAttempts++;
  try{ if(peer){ peer.destroy(); } }catch(_){}
  peer=new Peer(peerOptions());
  let settled=false;
  peer.on('open',()=>{
    conn=peer.connect(PREFIX+ROOM,{reliable:true});
    conn.on('open',()=>{
      settled=true; joinAttempts=0; setConnLive(true);
      sendHost({t:'hello', clientId:MYID, name:MYNAME, role:MYROLE});
      startPlayerPing();
      cb&&cb(true);
    });
    conn.on('data',handleHostMsg);
    conn.on('close',()=>{ setConnLive(false); scheduleRejoin(ROOM); });
    conn.on('error',()=>{ setConnLive(false); scheduleRejoin(ROOM); });
    setTimeout(()=>{ if(!settled){ try{peer.destroy();}catch(_){} if(cb&&joinAttempts<=1){ cb(false,'Could not reach the host. Is the host screen open?'); } else { scheduleRejoin(ROOM); } } },9000);
  });
  peer.on('error',(e)=>{
    if(e.type==='peer-unavailable'){ settled=true; if(cb&&joinAttempts<=1){cb(false,'No game with that code — is the host screen open?');} else { scheduleRejoin(ROOM); } }
    else if(!settled){ scheduleRejoin(ROOM); }
  });
}
// Keep retrying reconnection (server may be waking from sleep on the free tier).
let rejoinTries=0;
function scheduleRejoin(code){
  if(reconnectTimer || connLive) return;
  if(ROLE!=='player' && ROLE!=='judge') return;
  rejoinTries++;
  const delay=Math.min(2000 + rejoinTries*1500, 8000);   // backoff, capped at 8s
  showToast('Reconnecting…');
  reconnectTimer=setTimeout(()=>{
    reconnectTimer=null;
    if(!connLive){ joinRoom(code||ROOM, MYNAME, MYROLE, (ok)=>{ if(ok){ rejoinTries=0; showToast('Reconnected!'); } }); }
  },delay);
}
// Player heartbeat so the host knows we're alive; also helps detect wake.
let pingTimer=null;
function startPlayerPing(){ stopPlayerPing(); pingTimer=setInterval(()=>{ sendHost({t:'ping'}); },5000); }
function stopPlayerPing(){ if(pingTimer){clearInterval(pingTimer);pingTimer=null;} }

// PLAYER/JUDGE: handle messages from host.
let lastRoster=null;
function handleHostMsg(m){
  if(!m||!m.t) return;
  if(m.t==='welcome'){ MYID=m.clientId; try{localStorage.setItem('gd_clientid',MYID);}catch(e){} }
  else if(m.t==='state'){
    STATE=m.s;
    if(MYROLE==='judge'){ if(window.__renderJudge) window.__renderJudge(); }
    else { if(window.__renderPlayer) window.__renderPlayer(); }
  }
  else if(m.t==='roster'){ lastRoster=m; if(window.__renderPlayer&&(!STATE||!STATE.phase)) window.__renderPlayer(); }
  else if(m.t==='pong'){ /* alive confirmed */ }
}
function getRoster(){ return lastRoster; }
function startHeartbeat(){ stopHeartbeat(); hbTimer=setInterval(()=>{ if(ROLE==='stage') broadcast({t:'state',s:STATE}); },4000); }
function stopHeartbeat(){ if(hbTimer){clearInterval(hbTimer);hbTimer=null;} }
function setConnLive(v){ connLive=v; if(window.__onConn) window.__onConn(v); }

// When a backgrounded phone (e.g. opened WhatsApp) comes back, force a resync.
if(typeof document!=='undefined' && document.addEventListener){
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'){
      if(ROLE==='player'||ROLE==='judge'){
        if(!connLive && ROOM){ joinAttempts=0; joinRoom(ROOM,MYNAME,MYROLE,(ok)=>{ if(ok) showToast('Reconnected!'); }); }
        else { sendHost({t:'ping'}); }
      } else if(ROLE==='stage'){
        broadcast({t:'state',s:STATE});
      }
    }
  });
}

// Legacy handlers retained for any single-conn code paths during transition.
function handleJudgeMsg(m){ if(m.t==='action') applyAction(m.action,m.payload); }
function handleStageMsg(m){ if(m.t==='state'){ STATE=m.s; if(window.__renderJudge) window.__renderJudge(); } }

// ===================================================================
// REFRESH  (single source of truth for re-rendering)
// ===================================================================
let soloMode=false;
function refresh(){
  if(soloMode){ if(window.__renderStage)window.__renderStage(); if(window.__renderPlayer)window.__renderPlayer(); if(window.__renderJudge)window.__renderJudge(); }
  else if(ROLE==='stage'){ broadcast({t:'state',s:STATE}); if(window.__renderStage)window.__renderStage(); }
  else if(ROLE==='player'){ if(window.__renderPlayer)window.__renderPlayer(); }
  else if(ROLE==='judge'){ if(window.__renderJudge)window.__renderJudge(); }
}

// ===================================================================
// ACTIONS  (authority = host/stage or solo; players send to host)
// ===================================================================
// A player device requests an action; on host/solo it runs locally, else sent.
function judgeAct(action,payload){
  if(soloMode||ROLE==='stage') applyAction(action,payload||{});
  else sendHost({t:'action',action,payload:payload||{}});
}
// Alias used by player UI for clarity.
function playerAct(action,payload){ judgeAct(action,payload); }

function applyAction(action,p){
  if(!STATE) return;
  p=p||{};
  // --- Authorization (multiplayer) ---
  // In hosted multiplayer, validate WHO sent the action.
  const fromPid = (p.__fromPlayerId!=null) ? p.__fromPlayerId : null;
  const isRemote = (p.__from!=null);
  if(isRemote && !soloMode){
    if(action==='draftPick'){
      // Only the player whose turn it is may pick.
      if(!STATE.draft || STATE.draft.picker!==fromPid) return;
    }
    // duelCorrect / duelMiss / challenge / stopConquest: only a JUDGE device may send.
    if(action==='duelCorrect'||action==='duelMiss'||action==='challenge'||action==='stopConquest'){
      const senderRole = peers[p.__from] ? peers[p.__from].role : null;
      if(senderRole!=='judge') return;
    }
    // restart: ignore from players entirely
    if(action==='restart') return;
  }
  switch(action){
    case 'draftPick':      draftPick(p.blockId); break;
    case 'draftAdvance':   /* picker confirmed; handled in draftPick auto */ break;
    case 'challenge':      startDuel(p.blockId); break;
    case 'stopConquest':   pickConqueror(); break;
    case 'duelCorrect':    sfx('correct'); duelResolveTurn(true); break;
    case 'duelMiss':       sfx('pass'); duelResolveTurn(false); break;
    case 'restart':        STATE=freshState(STATE.players.map(pl=>({id:pl.id,name:pl.name,color:pl.color,clientId:pl.clientId})), STATE.blocks.map(b=>b.cat), STATE.rows, STATE.cols, {duelSeconds:STATE.duelSeconds, passPenalty:STATE.passPenalty}); break;
  }
  refresh();
}

// ---------- DRAFT (snake, connected growth) ----------
function draftPickable(pid){
  const free=STATE.blocks.filter(b=>b.owner===null);
  const mine=ownedBy(pid);
  if(mine.length===0){
    return seedCells(free,null);
  }
  // growth: free cells adjacent to my territory
  const adj=free.filter(b=> neighbors(b).some(nb=>nb.owner===pid));
  // If boxed in, seed as close to my existing territory as possible (keeps it
  // connected when feasible) so I still reach my fair quota.
  if(adj.length===0){ return seedCells(free,pid); }
  return adj;
}
function seedCells(free,nearPid){
  if(!free.length) return [];
  if(nearPid!=null){
    // closest free cell(s) to my own territory — minimizes disconnection
    const mine=ownedBy(nearPid);
    if(mine.length){
      const scored=free.map(b=>{
        let dmin=Infinity;
        mine.forEach(o=>{ const d=Math.abs(o.r-b.r)+Math.abs(o.c-b.c); if(d<dmin)dmin=d; });
        return {b,d:dmin};
      }).sort((a,z)=>a.d-z.d);
      const best=scored[0].d;
      return scored.filter(s=>s.d<=best).map(s=>s.b);
    }
  }
  // fresh seed: farthest from ALL owned tiles so regions have room
  const others=STATE.blocks.filter(b=>b.owner!==null);
  if(others.length===0) return free;
  const scored=free.map(b=>{
    let dmin=Infinity;
    others.forEach(o=>{ const d=Math.abs(o.r-b.r)+Math.abs(o.c-b.c); if(d<dmin)dmin=d; });
    return {b,d:dmin};
  }).sort((a,z)=>z.d-a.d);
  const best=scored[0].d;
  return scored.filter(s=>s.d>=best-1).map(s=>s.b);
}
function draftDone(){
  // every player has hit quota OR no free blocks remain
  return STATE.blocks.every(b=>b.owner!==null) ||
         STATE.draft.order.every(pid=>STATE.draft.claimed[pid]>=STATE.draft.quota[pid]);
}
function advanceDraftPicker(){
  const d=STATE.draft, n=d.order.length;
  let guard=0;
  do{
    d.ptr += d.dir;
    if(d.ptr>=n){ d.ptr=n-1; d.dir=-1; d.round++; }
    else if(d.ptr<0){ d.ptr=0; d.dir=1; d.round++; }
    d.picker=d.order[d.ptr];
    guard++;
    const done = d.claimed[d.picker]>=d.quota[d.picker];
    const canPick = draftPickable(d.picker).length>0;   // boxed players can now seed
    if(!done && canPick) return true;
  } while(guard < n*4 && !draftDone());
  return false;
}
function fillRemainder(){
  // Distribute leftover free blocks to keep territories BALANCED and connected.
  // Priority: give each block to the adjacent owner that is furthest BELOW its
  // quota (fewest tiles relative to fair share). This prevents one player from
  // snowballing while a boxed-in player stays small.
  const d=STATE.draft;
  let guard=0;
  while(STATE.blocks.some(b=>b.owner===null) && guard++<STATE.blocks.length*4){
    const free=STATE.blocks.filter(b=>b.owner===null);
    let placed=false;
    // sort free cells: fill ones with owned neighbors first
    for(const b of free){
      let nbOwners=[...new Set(neighbors(b).map(nb=>nb.owner).filter(o=>o!==null))];
      if(!nbOwners.length) continue;
      // prefer the owner most below their quota; tiebreak by fewest tiles
      nbOwners.sort((a,z)=>{
        const da=(d.quota[a]||0)-tileCount(a), dz=(d.quota[z]||0)-tileCount(z);
        if(dz!==da) return dz-da;             // bigger deficit first
        return tileCount(a)-tileCount(z);      // then fewest tiles
      });
      // only assign if that owner is at/below quota OR everyone adjacent is over
      const best=nbOwners[0];
      b.owner=best; d.claimed[best]=(d.claimed[best]||0)+1; placed=true;
    }
    if(!placed){ // isolated pocket: seed to the player furthest below quota
      const pid=d.order.slice().sort((a,z)=>((d.quota[z]-tileCount(z))-(d.quota[a]-tileCount(a))))[0];
      free[0].owner=pid; d.claimed[pid]=(d.claimed[pid]||0)+1;
    }
  }
}
function draftPick(blockId){
  const d=STATE.draft;
  const b=STATE.blocks[blockId];
  if(!b||b.owner!==null) return;
  const pickable=draftPickable(d.picker);
  if(!pickable.some(x=>x.id===blockId)){ STATE.flash='Pick a highlighted block (must touch your land)'; return; }
  b.owner=d.picker; d.claimed[d.picker]++;
  if(draftDone()){ fillRemainder(); beginConquest(); return; }
  if(!advanceDraftPicker()){ fillRemainder(); beginConquest(); }
}

// ---------- CONQUEST ----------
function beginConquest(){
  STATE.phase='conquest';
  STATE.conquest={ sub:'pickConqueror', conqueror:null, duel:null };
  pickConqueror();
}
function pickConqueror(){
  stopClock();
  checkWin(); if(STATE.phase==='gameover') return;
  const border=STATE.blocks.filter(isBorder);
  if(border.length===0){ checkWin(); return; }
  const chosen=rand(border);
  STATE.conquest.conqueror=chosen.owner;
  STATE.conquest.sub='chooseTarget';
  STATE.conquest.duel=null;
  const pl=STATE.players.find(x=>x.id===chosen.owner);
  STATE.flash='🎯 '+(pl?pl.name:'?')+' may conquer!';
}
function startDuel(blockId){
  const cq=STATE.conquest;
  const block=STATE.blocks[blockId];
  if(!block) return;
  const challenger=cq.conqueror, defender=block.owner;
  if(defender===null||defender===challenger) return;
  // must be a valid adjacent target
  if(!attackTargets(challenger).some(t=>t.id===blockId)){ STATE.flash='That block is not adjacent to your land'; return; }
  cq.sub='countdown';
  cq.count=3;
  cq.duel={
    blockId, cat:block.cat,
    challenger, defender,
    control:challenger,                 // challenger answers first
    time:{ [challenger]:STATE.duelSeconds, [defender]:STATE.duelSeconds },
    answer: drawQuestion(block),
    starter:challenger,
  };
  STATE.flash=null;
  startCountdown();
}
// 3 - 2 - 1 - GO before the clock runs. Driven by self-scheduling timeouts
// (each step schedules the next) and wrapped so a render error can NEVER
// freeze the sequence — the duel is guaranteed to start.
let cdTimers=[];
function clearCountdown(){ cdTimers.forEach(t=>clearTimeout(t)); cdTimers=[]; }
function startCountdown(){
  stopClock(); clearCountdown();
  try{ sfx('count'); }catch(e){}
  const cq=STATE.conquest;
  // schedule: 2 at +900, 1 at +1800, GO at +2700, start duel at +3600
  cdTimers.push(setTimeout(()=>cdStep(2),900));
  cdTimers.push(setTimeout(()=>cdStep(1),1800));
  cdTimers.push(setTimeout(()=>cdStep(0),2700));
  cdTimers.push(setTimeout(()=>cdStart(),3600));
}
function cdStep(n){
  const cq=STATE&&STATE.conquest;
  if(!cq||cq.sub!=='countdown'){ clearCountdown(); return; }
  cq.count=n;
  try{ sfx(n>0?'count':'go'); }catch(e){}
  try{ refresh(); }catch(e){ console.warn('countdown render',e); }
}
function cdStart(){
  clearCountdown();
  const cq=STATE&&STATE.conquest;
  if(!cq||cq.sub!=='countdown'){ return; }   // already moved on / cancelled
  cq.sub='duel'; cq.count=null;
  startClock();
  try{ refresh(); }catch(e){ console.warn('duel render',e); }
}
function drawQuestion(block){
  const list=getList(block.cat);
  if(block.qIndex>=block.order.length){ block.order=shuffle([...Array(list.length).keys()]); block.qIndex=0; }
  const idx=block.order[block.qIndex++];
  const a=normAnswer(list[idx]);
  return {name:a.name, wiki:a.wiki, img:a.img, cat:block.cat};
}
// Correct => hand control to opponent (your clock stops, theirs ticks).
// Miss/Pass => keep control, take a time PENALTY, keep burning your clock.
function duelResolveTurn(correct){
  const d=STATE.conquest.duel; if(!d) return;
  const block=STATE.blocks[d.blockId];
  if(correct){
    d.control = (d.control===d.challenger)?d.defender:d.challenger;
  } else {
    // pass/wrong penalty
    const pen=STATE.passPenalty||0;
    d.time[d.control]=Math.max(0, d.time[d.control]-pen);
    if(d.time[d.control]<=0){ endDuel(d.control); return; }
  }
  d.answer=drawQuestion(block);
  // clock keeps running on whoever now has control
}
function endDuel(loserId){
  const d=STATE.conquest.duel;
  const winnerId=(loserId===d.challenger)?d.defender:d.challenger;
  stopClock();
  sfx('timeup');
  if(winnerId===d.challenger){
    // challenger conquers the contested tile
    STATE.blocks[d.blockId].owner=d.challenger;
    if(window.__markWon) window.__markWon(d.blockId);
    const pl=STATE.players.find(x=>x.id===d.challenger);
    STATE.flash='✅ '+(pl?pl.name:'?')+' takes the tile!';
    checkWin();
    if(STATE.phase==='gameover'){ setTimeout(()=>sfx('win'),300); }
    else {
      setTimeout(()=>sfx('capture'),250);
      STATE.conquest.sub='chooseTarget';   // continue conquering or stop
      STATE.conquest.duel=null;
      // if no targets remain, auto-pick a new conqueror
      if(attackTargets(d.challenger).length===0) pickConqueror();
    }
  } else {
    // defender held; conqueror's turn ends
    const pl=STATE.players.find(x=>x.id===d.defender);
    STATE.flash='🛡️ '+(pl?pl.name:'?')+' defended!';
    setTimeout(()=>sfx('defend'),250);
    STATE.conquest.duel=null;
    pickConqueror();
  }
}
function checkWin(){
  STATE.players.forEach(pl=>{ pl.out = tileCount(pl.id)===0; });
  const alive=STATE.players.filter(pl=>!pl.out);
  const everyoneOneOwner = STATE.blocks.every(b=>b.owner===STATE.blocks[0].owner);
  if(alive.length<=1 || everyoneOneOwner){
    STATE.phase='gameover';
    STATE.winner = alive.length? alive[0].id : STATE.blocks[0].owner;
    stopClock();
  }
}

// ---------- IMAGES (Wikipedia, free-licensed) ----------
// To show a page's lead photo we must ask the API which file that is, then load
// it. Primary: Action API (origin=* → CORS works from any page, even file://).
// Fallback: REST summary endpoint. Result cached so each title is fetched once.
const imgCache={};
async function fetchImage(title){
  if(!title) return null;
  if(imgCache[title]!==undefined) return imgCache[title];
  const t=title.replace(/ /g,'_');
  let src=null;
  try{
    const api='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*'
      +'&prop=pageimages&piprop=thumbnail&pithumbsize=600&redirects=1&titles='+encodeURIComponent(title);
    const r=await fetch(api);
    if(r.ok){
      const j=await r.json();
      const pages=j&&j.query&&j.query.pages;
      if(pages){ for(const k in pages){ const p=pages[k]; if(p.thumbnail&&p.thumbnail.source){ src=p.thumbnail.source; break; } } }
    }
  }catch(e){}
  if(!src){
    try{
      const r2=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(t));
      if(r2.ok){ const j2=await r2.json(); src=(j2.thumbnail&&j2.thumbnail.source)||(j2.originalimage&&j2.originalimage.source)||null; }
    }catch(e){}
  }
  imgCache[title]=src; return src;
}

// ---------- PHOTO CACHE (IndexedDB — persists on device, works offline) ------
// First time a photo is shown it loads from Wikipedia and is saved on the
// device in the background. Next time that answer appears it loads instantly
// from local storage, with no internet needed. No giant download, mobile-safe.
let _idb=null, _idbTried=false;
function openPhotoDB(){
  return new Promise((resolve)=>{
    if(_idb) return resolve(_idb);
    if(_idbTried && !_idb) return resolve(null);
    try{
      if(typeof indexedDB==='undefined'){ _idbTried=true; return resolve(null); }
      const req=indexedDB.open('gridduel-photos',1);
      req.onupgradeneeded=()=>{ try{ req.result.createObjectStore('imgs'); }catch(e){} };
      req.onsuccess=()=>{ _idb=req.result; _idbTried=true; resolve(_idb); };
      req.onerror=()=>{ _idbTried=true; resolve(null); };
    }catch(e){ _idbTried=true; resolve(null); }
  });
}
function idbGet(key){
  return new Promise(async(resolve)=>{
    const db=await openPhotoDB(); if(!db) return resolve(null);
    try{ const r=db.transaction('imgs','readonly').objectStore('imgs').get(key);
      r.onsuccess=()=>resolve(r.result||null); r.onerror=()=>resolve(null);
    }catch(e){ resolve(null); }
  });
}
function idbPut(key,val){
  return new Promise(async(resolve)=>{
    const db=await openPhotoDB(); if(!db) return resolve(false);
    try{ const r=db.transaction('imgs','readwrite').objectStore('imgs').put(val,key);
      r.onsuccess=()=>resolve(true); r.onerror=()=>resolve(false);
    }catch(e){ resolve(false); }
  });
}
function idbCount(){
  return new Promise(async(resolve)=>{
    const db=await openPhotoDB(); if(!db) return resolve(0);
    try{ const r=db.transaction('imgs','readonly').objectStore('imgs').count();
      r.onsuccess=()=>resolve(r.result||0); r.onerror=()=>resolve(0);
    }catch(e){ resolve(0); }
  });
}
function clearPhotoCache(){
  return new Promise(async(resolve)=>{
    const db=await openPhotoDB(); if(!db) return resolve(false);
    try{ const r=db.transaction('imgs','readwrite').objectStore('imgs').clear();
      r.onsuccess=()=>resolve(true); r.onerror=()=>resolve(false);
    }catch(e){ resolve(false); }
  });
}
function cacheInBackground(key,url){
  (async()=>{
    try{
      const r=await fetch(url); if(!r.ok) return;
      const blob=await r.blob();
      const dataUrl=await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>res(null); fr.readAsDataURL(blob); });
      if(dataUrl) idbPut(key,dataUrl);
    }catch(e){}
  })();
}
// Main entry used by the UI: returns a displayable image URL, preferring the
// on-device cached copy. Never blocks display on the background download.
async function getImage(opt){
  // opt = {wiki, img}  (img = custom URL/dataURL that bypasses Wikipedia)
  if(opt && opt.img) return opt.img;
  const title = opt && opt.wiki;
  if(!title) return null;
  const key='t:'+title;
  const cached=await idbGet(key);
  if(cached) return cached;                 // instant + offline
  const url=await fetchImage(title);        // resolve remote URL
  if(!url) return null;
  cacheInBackground(key,url);               // save for next time (non-blocking)
  return url;                               // show immediately from remote
}

  if(players.length===0){ list.innerHTML='<p class="note dim">Waiting for players to join…</p>'; }
  players.forEach((p,i)=>{
    const row=el('div','lobby-player'); row.style.setProperty('--pc',PCOLORS[i%PCOLORS.length]);
    row.innerHTML=`<span class="lp-dot"></span><span class="lp-name">${p.name}</span><span class="lp-tag">ready</span>`;
    list.append(row);
  });
  w.append(list);

  const startInfo=el('p','note dim'); startInfo.style.marginTop='10px';
  const enoughPlayers=players.length>=2;
  startInfo.textContent = !enoughPlayers ? 'Need at least 2 players to start.'
    : !haveJudge ? `${players.length} players ready · waiting for a judge.`
    : `${players.length} players + judge ready.`;
  w.append(startInfo);
  const start=el('button','btn good'); start.textContent='Start Game ▶'; start.disabled=!(enoughPlayers&&haveJudge);
  start.onclick=startHostedGame; w.append(start);
  const cancel=el('button','btn ghost small','Cancel'); cancel.onclick=()=>{ currentScreen=null; renderMenu(); }; w.append(cancel);
  app.append(w);
}
function startHostedGame(){
  const alive=GD.lobbyPlayers().filter(p=>p.alive);
  if(alive.length<2){ showToast('Need at least 2 players'); return; }
  GD.assignPlayerSlots();
  // Build players from the lobby roster (names from their phones).
  const roster=GD.lobbyPlayers().filter(p=>p.alive);
  const players=roster.map((p,i)=>({id:i,name:p.name||('Player '+(i+1)),color:PCOLORS[i%PCOLORS.length],clientId:p.clientId}));
  const total=cfg.rows*cfg.cols;
  let pool=(cfg.selectedCats&&cfg.selectedCats.length)? cfg.selectedCats.slice()
            : Object.keys(GD.GAME_CONTENT).filter(c=>(GD.GAME_CONTENT[c]||[]).length>0);
  pool=pool.filter(c=>(GD.GAME_CONTENT[c]||[]).length>0);
  let cats=GD.shuffle([...pool]).slice(0,total);
  while(cats.length<total) cats.push(pool[cats.length%pool.length]);
  GD.STATE=GD.freshState(players,cats,cfg.rows,cfg.cols,{duelSeconds:cfg.duelSeconds,passPenalty:cfg.passPenalty});
  // tag each state player with their controlling device clientId
  GD.STATE.players.forEach((pl,i)=>{ pl.clientId=players[i].clientId; });
  GD.ROLE='stage'; currentScreen='game';
  lastPicker=-1; draftReady=false; lastStageSig=null; lastJudgeSig=null;
  GD.refresh(); renderStage();
}

let lastPicker=-1, draftReady=false;
function renderDraft(container){
  const st=S(); const d=st.draft;
  container.innerHTML='';
  const scr=el('div','draft-screen');

  if(d.picker!==lastPicker){ lastPicker=d.picker; draftReady=false; }

  // interstitial: hide previous picks until next player taps ready
  if(!draftReady){
    const inter=el('div','interstitial');
    inter.style.setProperty('--pc',colorOf(d.picker));
    inter.innerHTML=`<div class="pass-icon">📱➡️</div>
      <div class="pass-to">Pass the phone to</div>
      <div class="pass-name" style="color:${colorOf(d.picker)}">${nameOf(d.picker)}</div>
      <p class="note" style="max-width:300px;margin:10px auto">Others, look away! Your picks stay secret.</p>`;
    const rdy=el('button','btn',"I'm "+nameOf(d.picker)+" — Ready"); 
    rdy.onclick=()=>{ draftReady=true; renderDraft(container); };
    inter.append(rdy);
    scr.append(inter); container.append(scr); return;
  }

  const need=d.quota[d.picker]-d.claimed[d.picker];
  const totalQuota=d.quota[d.picker];
  scr.append(el('div','draft-head',
    `<div class="dh-name" style="color:${colorOf(d.picker)}">${nameOf(d.picker)}'s territory</div>
     <div class="dh-sub">Tap <b>1</b> block to claim · ${d.claimed[d.picker]}/${totalQuota} claimed${need>0?'':' (done)'}</div>`));

  const pickable=new Set(GD.draftPickable(d.picker).map(b=>b.id));
  const grid=el('div','grid-board'); grid.style.gridTemplateColumns=`repeat(${st.cols},1fr)`;
  st.blocks.forEach(b=>{
    const t=el('div','gb');
    if(b.owner===d.picker){ t.classList.add('mine'); t.style.setProperty('--pc',colorOf(d.picker)); t.innerHTML=`<span class="cat-name">${b.cat}</span><span class="chk">✓</span>`; }
    else if(b.owner!==null){ t.classList.add('taken'); t.innerHTML=`<span class="cat-name">${b.cat}</span><span class="lock">🔒</span>`; }
    else { t.innerHTML=`<span class="cat-name">${b.cat}</span>`; if(pickable.has(b.id)){ t.classList.add('pickable'); t.onclick=()=>{ GD.sfx&&GD.sfx('pick'); judgeAct('draftPick',{blockId:b.id}); }; } else { t.classList.add('faded'); } }
    grid.append(t);
  });
  scr.append(grid);

  if(st.flash){ const f=el('div','draft-flash',st.flash); scr.append(f); st.flash=null; }

  // progress: one dot per player, showing how much of their quota is claimed
  const prog=el('div','draft-prog');
  st.draft.order.forEach((pid)=>{
    const filled=d.claimed[pid]>=d.quota[pid];
    const dot=el('span','pdot'+(filled?' done':pid===d.picker?' active':''));
    dot.style.background=colorOf(pid); prog.append(dot);
  });
  scr.append(prog);
  container.append(scr);
}

// ===================================================================
// STAGE SCREEN
// ===================================================================
let lastStageSig=null;
function stageSig(st){
  if(!st) return 'none';
  const own=st.blocks.map(b=>b.owner).join(',');
  const d=st.conquest&&st.conquest.duel;
  return [st.phase, st.conquest&&st.conquest.sub, st.conquest&&st.conquest.conqueror, st.conquest&&st.conquest.count,
    d&&d.blockId, d&&d.control, d&&d.answer&&d.answer.name, st.winner,
    st.draft&&st.draft.picker, GD.connLive, GD.ROOM, st.flash, own].join('|');
}
function updateStageClocks(){
  const st=S(); const d=st&&st.conquest&&st.conquest.duel; if(!d) return;
  [d.challenger,d.defender].forEach(pid=>{
    const e=document.getElementById('sclk-'+pid);
    if(e){ e.textContent=d.time[pid]; e.classList.toggle('low',d.time[pid]<=10); }
  });
}
function renderStage(){
  if(GD.ROLE!=='stage' && !GD.soloMode) return;
  const st=S(); if(!st) return;
  const host = GD.soloMode ? $('soloStage') : app;
  // GUARD: if nothing structural changed (just a clock tick), update numbers only
  const sig=stageSig(st);
  if(sig===lastStageSig && host.querySelector && host.querySelector('#stageScreen')){ updateStageClocks(); return; }
  lastStageSig=sig;
  if(!GD.soloMode) app.innerHTML='';
  host.innerHTML='';
  const scr=el('div'); scr.id='stageScreen';

  const head=el('div','stage-head');
  const alive=st.players.filter(p=>!p.out).length;
  head.innerHTML=`<div class="mini-logo">GRID DUEL</div><div class="roundinfo">${st.players.length} players · ${alive} in</div>`;
  if(!GD.soloMode){ const pill=el('div','status-pill'+(GD.connLive?' live':'')); pill.innerHTML=`<span class="dot"></span><span class="txt">${GD.connLive?'Judge connected':'Waiting…'}</span> · ${GD.ROOM}`; head.append(pill); }
  scr.append(head);

  if(st.phase==='draft'){
    if(!GD.soloMode && !GD.connLive){
      scr.append(roomCodeCard());
    } else {
      // Live draft board: players pick on their own phones; host shows progress.
      const d=st.draft;
      if(d){ scr.append(el('div','stage-flash','✋ '+nameOf(d.picker)+' is choosing a tile…')); }
      scr.append(buildBoardStage(st));
      scr.append(buildMiniScores(st));
    }
  }
  else if(st.phase==='conquest'){
    if(st.conquest.sub!=='countdown'){ document.querySelectorAll('.countdown').forEach(x=>x.remove()); }
    if(st.conquest.sub==='duel'){ scr.append(buildDuelStage(st)); }
    else if(st.conquest.sub==='countdown'){ scr.append(buildBoardStage(st)); buildCountdown(st); }
    else { scr.append(buildBoardStage(st)); }
  }
  else if(st.phase==='gameover'){ document.querySelectorAll('.countdown').forEach(x=>x.remove()); scr.append(buildBoardStage(st)); buildWinnerOverlay(st); }

  host.append(scr);
}

function buildCountdown(st){
  const d=st.conquest.duel; if(!d) return;
  // remove any stale overlay first
  document.querySelectorAll('.countdown').forEach(x=>x.remove());
  const o=el('div','countdown');
  const n=st.conquest.count;
  o.innerHTML=`<div class="cd-vs"><b style="color:${colorOf(d.challenger)}">${nameOf(d.challenger)}</b> vs <b style="color:${colorOf(d.defender)}">${nameOf(d.defender)}</b></div>
    <div class="cd-cat">${d.cat}</div>
    <div class="cd-num cd-pop ${n<=0?'go':''}">${n>0?n:'GO!'}</div>`;
  const host = GD.soloMode ? ($('soloStage')||app) : app;
  host.append(o);
}

function roomCodeCard(){
  const c=el('div','roomcode');
  c.innerHTML=`<div class="label">Judge joins with code</div><div class="code">${GD.ROOM}</div>
    <div class="status-pill"><span class="dot"></span><span class="txt">Waiting…</span></div>
    <p class="note" style="max-width:360px;margin:14px auto 0">Open this game on a 2nd phone → <b>Be the Judge</b> → enter this code. Players draft on that phone.</p>`;
  return c;
}

function buildBoardStage(st){
  const wrap=el('div','board-wrap');
  const cq=st.conquest;
  if(st.flash){ wrap.append(el('div','stage-flash',st.flash)); }
  else if(cq&&cq.sub==='chooseTarget'){ wrap.append(el('div','stage-flash','🎯 '+nameOf(cq.conqueror)+' — pick a 🎯 target')); }
  const grid=el('div','grid-board big'); grid.style.gridTemplateColumns=`repeat(${st.cols},1fr)`; grid.style.gridTemplateRows=`repeat(${st.rows},1fr)`;
  const choosing = cq&&cq.sub==='chooseTarget';
  const targets = choosing ? new Set(GD.attackTargets(cq.conqueror).map(b=>b.id)) : new Set();
  st.blocks.forEach(b=>{
    const t=el('div','gb owned'); t.style.setProperty('--pc',colorOf(b.owner));
    if(cq&&b.owner===cq.conqueror) t.classList.add('conq');
    if(targets.has(b.id)) t.classList.add('target');
    // During target-selection, dim everything that's neither the conqueror's land nor a target
    if(choosing && b.owner!==cq.conqueror && !targets.has(b.id)) t.classList.add('faded');
    if(b.id===justWonId) t.classList.add('just-won');
    t.innerHTML=`<span class="cat-name">${b.cat}</span><span class="ot">${nameOf(b.owner)}</span>`;
    grid.append(t);
  });
  wrap.append(grid);
  wrap.append(buildMiniScores(st));
  return wrap;
}
let justWonId=null;

function buildDuelStage(st){
  const d=st.conquest.duel;
  const q=el('div','qstage');
  const ch=st.players.find(p=>p.id===d.challenger), df=st.players.find(p=>p.id===d.defender);
  const banner=el('div','duel-banner');
  banner.append(duelSide(ch,d.time[ch.id],d.control===ch.id), el('div','duel-vs','VS'), duelSide(df,d.time[df.id],d.control===df.id));
  q.append(banner);
  q.insertAdjacentHTML('beforeend',`<div class="cat-banner">${d.cat}</div>
    <div class="img-frame"><span class="ld">Loading clue…</span></div>
    <div class="qcount">${nameOf(d.control)} — name it! (correct = hand off)</div>`);
  loadImageInto(q.querySelector('.img-frame'),d.answer);
  return q;
}
function duelSide(p,secs,active){
  const d=el('div','duel-side'+(active?' active-turn':'')); d.style.setProperty('--sc',p.color);
  d.innerHTML=`<div class="nm">${p.name}</div><div class="clk mono${secs<=10?' low':''}" id="sclk-${p.id}">${secs}</div>`;
  return d;
}
function buildMiniScores(st){
  const sb=el('div','mini-scores');
  const ranked=[...st.players].sort((a,b)=>GD.tileCount(b.id)-GD.tileCount(a.id));
  const lead=ranked.length?GD.tileCount(ranked[0].id):0;
  // whose turn is it right now?
  let activePid=null;
  if(st.phase==='draft' && st.draft) activePid=st.draft.picker;
  else if(st.phase==='conquest' && st.conquest) activePid=st.conquest.conqueror;
  ranked.forEach(p=>{
    const n=GD.tileCount(p.id);
    const isLead = n===lead && n>0;
    const isActive = p.id===activePid;
    const r=el('div','ms-chip'+(p.out?' out':'')+(isActive?' active-turn':'')); r.style.setProperty('--pc',p.color);
    r.innerHTML=`<span class="sw"></span>${isLead?'👑 ':''}${p.name} <b>${n}</b>`;
    sb.append(r);
  });
  return sb;
}
async function resolveImage(ans){
  // Uses the on-device photo cache (instant + offline after first view).
  if(ans && ans.img) return ans.img;
  if(ans && ans.wiki){
    let src=await GD.getImage({wiki:ans.wiki});
    if(!src){ await new Promise(r=>setTimeout(r,400)); src=await GD.getImage({wiki:ans.wiki}); }
    return src;
  }
  return null;
}
async function loadImageInto(frame,ans){
  if(!frame) return;
  frame.innerHTML='<span class="ld">Loading clue…</span>';
  const src=await resolveImage(ans);
  if(!frame.isConnected && frame.parentNode===null) return; // frame removed mid-load
  if(src){
    const img=new Image();
    img.alt=''; img.className='clue-img';
    img.onload=()=>{ frame.innerHTML=''; frame.appendChild(img); };
    img.onerror=()=>{ frame.innerHTML=`<div class="img-fallback"><div class="fb-q">?</div><div class="fb-cat">${ans&&ans.cat?ans.cat:''}</div></div>`; };
    img.src=src;
  } else {
    frame.innerHTML=`<div class="img-fallback"><div class="fb-q">?</div><div class="fb-cat">${ans&&ans.cat?ans.cat:''}</div></div>`;
  }
}
function buildWinnerOverlay(st){
  const o=el('div','overlay');
  const wn=st.winner!=null?nameOf(st.winner):'Nobody';
  o.innerHTML=`<div class="crown">👑</div><h1>Conqueror</h1><div class="wname" style="color:${st.winner!=null?colorOf(st.winner):'#fff'}">${wn}</div>`;
  const again=el('button','btn','Play Again'); again.onclick=()=>judgeAct('restart'); o.append(again);
  (GD.soloMode?app:app).append(o);
}

let lastJudgeSig=null;
function judgeSig(st){
  if(!st) return 'none';
  const own=st.blocks.map(b=>b.owner).join(',');
  const d=st.conquest&&st.conquest.duel;
  return [st.phase, st.conquest&&st.conquest.sub, st.conquest&&st.conquest.conqueror, st.conquest&&st.conquest.count,
    d&&d.blockId, d&&d.control, d&&d.answer&&d.answer.name, st.winner, own, GD.soloMode].join('|');
}
function updateJudgeClocks(){
  const st=S(); const d=st&&st.conquest&&st.conquest.duel; if(!d) return;
  [d.challenger,d.defender].forEach(pid=>{
    const e=document.getElementById('jclk-'+pid);
    if(e){ e.textContent=d.time[pid]+'s'; e.classList.toggle('low',d.time[pid]<=10); }
  });
  const ti=document.getElementById('jturnclk'); if(ti) ti.textContent=d.time[d.control]+'s';
}
function renderJudge(){
  if(GD.ROLE!=='judge' && !GD.soloMode) return;
  const st=S(); if(!st) return;
  const host = GD.soloMode ? $('soloJudge') : app;

  if(st.phase==='draft'){ lastJudgeSig=null; if(!GD.soloMode)app.innerHTML=''; host.innerHTML=''; renderDraft(host); return; }

  // GUARD: skip full rebuild on plain clock ticks — just update the numbers
  const sig=judgeSig(st);
  if(sig===lastJudgeSig && host.querySelector && host.querySelector('#judgeScreen')){ updateJudgeClocks(); return; }
  lastJudgeSig=sig;

  if(!GD.soloMode) app.innerHTML='';
  host.innerHTML='';
  const scr=el('div'); scr.id='judgeScreen';
  const head=el('div','judge-head'); head.innerHTML=`<div class="ttl">⚖️ JUDGE</div>`;
  const right=el('div'); right.style.display='flex'; right.style.gap='8px'; right.style.alignItems='center';
  right.append(soundToggle());
  if(!GD.soloMode){ const pill=el('div','status-pill live'); pill.innerHTML=`<span class="dot"></span>Linked`; right.append(pill); }
  head.append(right);
  scr.append(head);

  if(st.phase==='gameover'){ scr.append(judgeGameover(st)); }
  else if(st.conquest.sub==='chooseTarget'){ scr.append(judgeChooseTarget(st)); }
  else if(st.conquest.sub==='duel'){ scr.append(judgeDuel(st)); }
  else if(st.conquest.sub==='countdown'){ const c=el('div','phase-card'); c.innerHTML=`<div class="ph-label">Get ready…</div><div class="conq-name" style="color:var(--gold)">${st.conquest.count>0?st.conquest.count:'GO!'}</div><p class="note">Duel starting — clock begins on GO.</p>`; scr.append(c); }
  else { const c=el('div','phase-card'); c.innerHTML=`<p class="note">Selecting next conqueror…</p>`; scr.append(c); }

  scr.append(buildScoreboard(st));
  scr.append(rulesAccordion());
  host.append(scr);
}

function judgeChooseTarget(st){
  const cq=st.conquest;
  const c=el('div','phase-card');
  c.innerHTML=`<div class="ph-label">Conqueror</div>
    <div class="conq-name" style="color:${colorOf(cq.conqueror)}">🎯 ${nameOf(cq.conqueror)}</div>
    <p class="note">Tap an adjacent enemy block to challenge it, or stop to pass the turn.</p>`;
  const targets=GD.attackTargets(cq.conqueror);
  const grid=el('div','tile-picker');
  if(targets.length===0){ c.append(el('p','note','No adjacent enemies — passing turn.')); }
  targets.forEach(b=>{
    const t=el('div','tp-tile owned'); t.style.setProperty('--pc',colorOf(b.owner));
    t.innerHTML=`<div>${b.cat}</div><div class="o">${nameOf(b.owner)}</div>`;
    t.onclick=()=>{ GD.sfx&&GD.sfx('select'); judgeAct('challenge',{blockId:b.id}); };
    grid.append(t);
  });
  c.append(grid);
  const stop=el('button','btn ghost small','✋ Stop — pass to random conqueror'); stop.style.marginTop='12px';
  stop.onclick=()=>judgeAct('stopConquest'); c.append(stop);
  return c;
}

function judgeDuel(st){
  const d=st.conquest.duel;
  const cur=st.players.find(p=>p.id===d.control);
  const c=el('div','phase-card');
  const opp=(d.control===d.challenger)?d.defender:d.challenger;
  const pen=st.passPenalty||0;
  c.innerHTML=`<div class="duel-clocks">
      <div class="dc ${d.control===d.challenger?'on':''}" style="--sc:${colorOf(d.challenger)}"><span>${nameOf(d.challenger)}</span><b id="jclk-${d.challenger}" class="${d.time[d.challenger]<=10?'low':''}">${d.time[d.challenger]}s</b></div>
      <div class="dc ${d.control===d.defender?'on':''}" style="--sc:${colorOf(d.defender)}"><span>${nameOf(d.defender)}</span><b id="jclk-${d.defender}" class="${d.time[d.defender]<=10?'low':''}">${d.time[d.defender]}s</b></div>
    </div>
    <div class="judge-turn-info">Answering: <b style="color:${cur.color}">${nameOf(d.control)}</b> · clock <span id="jturnclk">${d.time[d.control]}s</span></div>`;
  c.append(answerReveal(d.answer));
  const acts=el('div','judge-actions');
  const ok=el('button','btn good','✓ Correct'); ok.onclick=()=>judgeAct('duelCorrect');
  const no=el('button','btn hot',`✗ Miss / Pass  (−${pen}s)`); no.onclick=()=>judgeAct('duelMiss');
  acts.append(ok,no); c.append(acts);
  c.insertAdjacentHTML('beforeend',`<p class="note" style="margin-top:10px"><b>Correct</b> → hands control to ${nameOf(opp)} (their clock runs). <b>Miss/Pass</b> → ${nameOf(d.control)} loses <b>${pen}s</b> and keeps going, burning their own clock. Duel ends when a clock hits 0.</p>`);
  return c;
}

function answerReveal(ans){
  const r=el('div','answer-reveal');
  r.innerHTML=`<div class="a-label">Answer (judge only)</div><div class="a-name">${ans.name}</div>`;
  const img=el('img','a-img'); resolveImage(ans).then(s=>{ if(s)img.src=s; else img.style.display='none'; });
  r.append(img); return r;
}

function judgeGameover(st){
  const c=el('div','phase-card');
  c.innerHTML=`<div class="ph-label">Game Over</div><div class="conq-name" style="color:${st.winner!=null?colorOf(st.winner):'#fff'}">👑 ${st.winner!=null?nameOf(st.winner):'No winner'} conquered the board!</div>`;
  const r=el('button','btn good','Play Again'); r.style.marginTop='12px'; r.onclick=()=>judgeAct('restart'); c.append(r);
  return c;
}

function buildScoreboard(st){
  const c=el('div','phase-card');
  c.innerHTML=`<div class="ph-label">Territory</div>`;
  const sb=el('div','scoreboard');
  [...st.players].sort((a,b)=>GD.tileCount(b.id)-GD.tileCount(a.id)).forEach(p=>{
    const r=el('div','sb-row'+(p.out?' out':'')); r.style.setProperty('--pc',p.color);
    r.innerHTML=`<span class="nm">${p.name}</span><span class="ct">${GD.tileCount(p.id)}</span>`;
    sb.append(r);
  });
  c.append(sb); return c;
}

function rulesAccordion(){
  const d=el('details');
  d.innerHTML=`<summary>📖 Rules</summary>
    <ul>
      <li><b>Draft:</b> each player secretly claims a connected block of categories (pass the phone).</li>
      <li><b>Conquer:</b> a random border owner becomes the conqueror and challenges an adjacent enemy block.</li>
      <li><b>Duel:</b> the controller's clock ticks. <b>Correct</b> hands control to the opponent (their clock now runs). <b>Miss/Pass</b> keeps you in control, costs a time penalty, and keeps burning your own clock.</li>
      <li><b>Win a duel:</b> the other player's clock hits <b>0</b>. Pictures keep coming until then — one correct answer never ends it.</li>
      <li><b>Spoils:</b> if the challenger wins, they take that one tile and may challenge again or stop. If the defender wins, the turn passes to a new random conqueror.</li>
      <li><b>Out:</b> own 0 blocks and you're eliminated. <b>Win:</b> conquer the entire board.</li>
    </ul>`;
  return d;
}

// ===================================================================

  const w=el('div','wrap');
  const s=el('div'); s.id='soloStage';
